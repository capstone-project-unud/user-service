root = "."
tmp_dir = ".air"
env_files = []

[build]
cmd = "go build -buildvcs=false -o ./.air/service ./cmd/api"
entrypoint = ["./.air/service"]
include_ext = ["go"]
include_file = ["go.mod", "go.sum"]
exclude_dir = [".git", ".air", "bin", "vendor"]
exclude_regex = ["_test\\.go$"]
exclude_unchanged = true
poll = true
poll_interval = 500
delay = 500
stop_on_error = true
send_interrupt = true
kill_delay = "1s"
log = "build-errors.log"

[log]
time = true

[misc]
clean_on_exit = false

[screen]
clear_on_rebuild = false
keep_scroll = true
